[project]
name = "axi-showcase"
version = "0.1.0"
description = "Interactive Marimo notebooks showcasing Axiomatic Intelligence."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anywidget>=0.9.21",
    "ax-core[argmin]",
    "marimo>=0.23.16",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
ax-core = { path = "../ax-stack/core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
